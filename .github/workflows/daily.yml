name: Daily Stage2 Screener Update

on:
  schedule:
    # 平日 米市場クローズ後（UTC 22:30 ≒ 東部18:30）
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stage2 screener
        run: |
          python scripts/update_screener.py

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json data/industry_cache.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Stage2 screener data $(date -u +%Y-%m-%d)"
            git push
          fi
